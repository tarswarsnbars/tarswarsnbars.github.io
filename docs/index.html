  <script>
    const images = document.querySelectorAll('#slideshow img');
    const slideshow = document.getElementById('slideshow');
    let current = 0;

    function showImage(index) {
      images.forEach((img, i) => {
        img.classList.toggle('active', i === index);
      });

      // Resize the container to match the active image
      const activeImage = images[index];
      slideshow.style.width = activeImage.naturalWidth + 'px';
      slideshow.style.height = activeImage.naturalHeight + 'px';
    }

    // Wait for all images to load before starting
    let loaded = 0;
    images.forEach(img => {
      img.onload = () => {
        loaded++;
        if (loaded === images.length) {
          showImage(current); // show first image with correct size
          setInterval(() => {
            current = (current + 1) % images.length;
            showImage(current);
          }, 10000);
        }
      };
    });
  </script>
